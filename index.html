<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Sơn Work - Hệ thống Quản trị Trường học</title>
    <!-- Tailwind CSS trang trí giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <script>
        // 1. KẾT NỐI SUPABASE (Thay thông tin của thầy vào đây)
        const SUPABASE_URL = 'https://lkvyigctxkxiwfmdijrx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdnlpZ2N0eGt4aXdmbWRpanJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTQ1NzgsImV4cCI6MjEwMjY5MDU3OH0.OAgFnwrZQwVfA2KNZL-xXFLO6VGisnx7DS0wkyRah7A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <!-- HEADER -->
    <header class="bg-blue-800 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">TRƯỜNG THPT MAI SƠN - MAI SƠN WORK v1</h1>
            <p class="text-sm text-blue-200">Hệ thống Điều hành & Quản trị Luồng công việc</p>
        </div>
        <div class="text-right">
            <span class="block font-semibold">Hiệu trưởng: Hoàng Anh Chung</span>
            <span class="text-xs bg-green-500 text-white px-2 py-1 rounded">Chế độ Chỉ huy</span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- CỘT 1: FORM GIAO VIỆC (Dành cho Hiệu trưởng) -->
        <div class="bg-white p-5 rounded-lg shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">➕ Giao nhiệm vụ mới</h2>
            <form id="createTaskForm" onsubmit="handleCreateTask(event)">
                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">Tên công việc / Chỉ đạo (*)</label>
                    <input type="text" id="title" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" placeholder="VD: Báo cáo chuyên môn HK1">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">Yêu cầu sản phẩm đầu ra (*)</label>
                    <textarea id="output_req" required class="w-full border p-2 rounded" rows="3" placeholder="VD: Nộp file PDF kế hoạch + Biên bản họp"></textarea>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-semibold mb-1">Giao cho (*)</label>
                    <select id="assignee_id" class="w-full border p-2 rounded">
                        <option value="2">PHT. Nguyễn Văn A</option>
                        <option value="3">GV. Lê Thị C (Toán)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1">Hạn chót (Deadline) (*)</label>
                    <input type="datetime-local" id="due_date" required class="w-full border p-2 rounded">
                </div>
                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded transition">
                    🚀 Phát hành & Giao việc
                </button>
            </form>
        </div>

        <!-- CỘT 2 & 3: DANH SÁCH CÔNG VIỆC & THEO DÕI TIẾN ĐỘ -->
        <div class="md:col-span-2 bg-white p-5 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-bold text-gray-800">📋 Danh sách Luồng công việc toàn trường</h2>
                <button onclick="loadTasks()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">🔄 Tải lại</button>
            </div>

            <!-- Bảng danh sách công việc -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-sm font-semibold text-gray-700">
                            <th class="p-2 border">Mã</th>
                            <th class="p-2 border">Tên công việc</th>
                            <th class="p-2 border">Yêu cầu đầu ra</th>
                            <th class="p-2 border">Trạng thái</th>
                            <th class="p-2 border">Hạn chót</th>
                            <th class="p-2 border">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="taskList" class="text-sm">
                        <!-- Dữ liệu sẽ nạp tự động từ Supabase vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ LOGIC API -->
    <script>
        // 1. Hàm nạp danh sách công việc từ Supabase
        async function loadTasks() {
            const { data, error } = await _supabase
                .from('work_items')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            const tbody = document.getElementById('taskList');
            tbody.innerHTML = '';

            data.forEach(task => {
                let statusBadge = '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-bold">Mới tạo</span>';
                if(task.status === 'DA_TIEP_NHAN') statusBadge = '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">Đã tiếp nhận</span>';
                if(task.status === 'HOAN_THANH') statusBadge = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Hoàn thành</span>';

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-bold">${task.code}</td>
                        <td class="p-2 font-semibold text-blue-900">${task.title}</td>
                        <td class="p-2 text-gray-600">${task.output_requirements}</td>
                        <td class="p-2">${statusBadge}</td>
                        <td class="p-2 text-red-600 font-semibold">${new Date(task.due_date).toLocaleString('vi-VN')}</td>
                        <td class="p-2">
                            ${task.status === 'MOI_TAO' 
                                ? `<button onclick="acceptTask(${task.id})" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs">Bấm Tiếp nhận</button>` 
                                : '<span class="text-xs text-gray-400">Đã nhận</span>'}
                        </td>
                    </tr>
                `;
            });
        }

        // 2. Hàm xử lý Tạo công việc mới (Hiệu trưởng giao)
        async function handleCreateTask(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const output_req = document.getElementById('output_req').value;
            const assignee_id = document.getElementById('assignee_id').value;
            const due_date = document.getElementById('due_date').value;

            const code = 'CV-' + Math.floor(1000 + Math.random() * 9000);

            const { error } = await _supabase.from('work_items').insert([{
                code: code,
                title: title,
                output_requirements: output_req,
                created_by: 1, // ID Hiệu trưởng
                assignee_id: parseInt(assignee_id),
                due_date: due_date,
                status: 'MOI_TAO'
            }]);

            if (error) {
                alert('Lỗi khi giao việc: ' + error.message);
            } else {
                alert('🚀 Đã phát hành luồng công việc thành công!');
                document.getElementById('createTaskForm').reset();
                loadTasks();
            }
        }

        // 3. Hàm Tiếp nhận công việc
        async function acceptTask(taskId) {
            const { error } = await _supabase
                .from('work_items')
                .update({ status: 'DA_TIEP_NHAN' })
                .eq('id', taskId);

            if (!error) {
                alert('✅ Đã bấm Tiếp nhận công việc!');
                loadTasks();
            }
        }

        // Tự động tải danh sách khi mở trang web
        loadTasks();
    </script>
</body>
</html>
